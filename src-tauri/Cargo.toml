[package]
name = "hyji"
version = "3.1.0"
description = "Highlight Your Journey of Insights — Desktop research hub for academic papers"
authors = ["HYJI"]
edition = "2021"

[lib]
name = "hyji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "system-proxy"] }
tokio = { version = "1", features = ["time", "sync"] }
# PDFium render backend (3.0). Dynamic binding: the DLL is fetched by
# scripts/fetch-pdfium.mjs and bundled as a resource; the app runs without it.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
